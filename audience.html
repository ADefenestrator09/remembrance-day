<!DOCTYPE html>
<html lang="en" data-theme="maple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remembrance Day – Audience screen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#120708; --glow:#2c0e14; --text:#f5ece6; --muted:#b9a09b; --poppy:#d1112f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse 80% 70% at 50% 40%, var(--glow), var(--bg) 75%); color: var(--text);
         font-family: Georgia, "Times New Roman", serif; overflow: hidden; cursor: default; }
  body.idle { cursor: none; }

  /* ---- picture slideshow ---- */
  #show { position: fixed; inset: 0; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease; }
  .slide.on { opacity: 1; }
  .slide .bg { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: blur(34px) brightness(.38) saturate(1.1); }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide.on img { animation: slow var(--dur, 10s) ease-out forwards; }
  @keyframes slow { from { transform: scale(1); } to { transform: scale(1.045); } }
  #show::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 100% at 50% 50%, transparent 62%, rgba(10,3,4,.55) 100%); }

  /* ---- when there are no pictures (or between tabs) ---- */
  #title { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vmin; }
  #title.on { display: flex; }
  #title svg { width: min(22vmin, 190px); height: auto; filter: drop-shadow(0 0 28px rgba(200,16,46,.55)); }
  #title h1 { font-weight: 400; letter-spacing: .06em; font-size: clamp(2rem, 7vmin, 4.4rem); margin: 3vmin 0 .5vmin; }
  #title p { color: var(--muted); font-style: italic; font-size: clamp(1.1rem, 3vmin, 2rem); margin: 0; }

  #caption { position: fixed; left: 0; right: 0; bottom: 3.2vh; text-align: center; font-size: clamp(1rem, 2.4vmin, 1.6rem);
    letter-spacing: .12em; text-transform: uppercase; color: rgba(245,236,230,.85); text-shadow: 0 2px 10px #000;
    opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  #caption.on { opacity: 1; }

  /* ---- slides / video ---- */
  #embed { position: fixed; inset: 0; background: #000; display: none; }
  #embed.on { display: block; }
  #embed iframe, #embed video { width: 100%; height: 100%; border: 0; background: #000; }
  #embed .msg { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8vmin; font-size: clamp(1.1rem, 3vmin, 2rem); color: var(--muted); }
  #embed .msg a { color: #fff; }

  /* ---- soft drifting leaves ---- */
  #drift { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  #drift svg { position: absolute; top: -12vh; fill: var(--poppy); opacity: 0; animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--o, .3); }
    50%  { transform: translate(calc(var(--dx) * .5), 62vh) rotate(calc(var(--rot) * .5)); }
    92%  { opacity: var(--o, .3); }
    100% { transform: translate(var(--dx), 128vh) rotate(var(--rot)); opacity: 0; }
  }
  body.noeffects #drift { display: none; }
  @media (prefers-reduced-motion: reduce) {
    #drift { display: none; }
    .slide { transition: opacity .6s linear; }
    .slide.on img { animation: none; }
  }

  #hint { position: fixed; top: 2vh; left: 0; right: 0; text-align: center; font-size: .95rem; color: rgba(245,236,230,.8);
    text-shadow: 0 1px 6px #000; opacity: 1; transition: opacity 1.5s ease; pointer-events: none; z-index: 5; }
  #hint.off { opacity: 0; }
</style>
</head>
<body>

<div id="show"></div>

<div id="title">
  <svg viewBox="-50 -50 100 100" aria-hidden="true"><g fill="#c8102e"><ellipse cx="0" cy="-22" rx="19" ry="23"/><ellipse cx="0" cy="-22" rx="19" ry="23" transform="rotate(72)"/><ellipse cx="0" cy="-22" rx="19" ry="23" transform="rotate(144)"/><ellipse cx="0" cy="-22" rx="19" ry="23" transform="rotate(216)"/><ellipse cx="0" cy="-22" rx="19" ry="23" transform="rotate(288)"/></g><circle r="10" fill="#1a0d10"/></svg>
  <h1 id="tTitle">Remembrance Day</h1>
  <p id="tSub">Lest we forget</p>
</div>

<div id="caption"></div>
<div id="embed"></div>
<div id="drift"></div>
<div id="hint">Double-click (or press F) for full screen. This window follows the presenter window.</div>

<script src="config.js"></script>
<script>
const CFG = window.REMEMBRANCE_CONFIG || {};
const $ = id => document.getElementById(id);
const IMAGES = Array.isArray(CFG.images) ? CFG.images.filter(Boolean) : [];
const SECS = Math.max(3, +CFG.imageSeconds || 10);
const LEAF = "M100.0 0.0 L112.0 30.0 L124.0 24.0 L121.0 54.0 L148.0 38.0 L142.0 68.0 L172.0 70.0 L154.0 92.0 L166.0 110.0 L130.0 102.0 L134.0 128.0 L111.0 118.0 L104.0 156.0 L103.0 198.0 L97.0 198.0 L96.0 156.0 L89.0 118.0 L66.0 128.0 L70.0 102.0 L34.0 110.0 L46.0 92.0 L28.0 70.0 L58.0 68.0 L52.0 38.0 L79.0 54.0 L76.0 24.0 L88.0 30.0 L100.0 0.0 Z";

if (CFG.title) { document.title = CFG.title + " – Audience screen"; $("tTitle").textContent = CFG.title; }
if (typeof CFG.subtitle === "string") $("tSub").textContent = CFG.subtitle;
if (CFG.effects === false) document.body.classList.add("noeffects");

/* ---------- drifting leaves ---------- */
(function () {
  const box = $("drift");
  for (let i = 0; i < 9; i++) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 200 200");
    s.innerHTML = '<path d="' + LEAF + '"/>';
    const size = 16 + Math.random() * 26;
    s.style.cssText = "left:" + (Math.random() * 100) + "%;width:" + size + "px;height:" + size + "px;" +
      "--dx:" + ((Math.random() - .5) * 22) + "vw;--rot:" + ((Math.random() - .5) * 700) + "deg;--o:" + (.14 + Math.random() * .2) + ";" +
      "animation-duration:" + (24 + Math.random() * 20) + "s;animation-delay:-" + (Math.random() * 40) + "s";
    box.appendChild(s);
  }
})();

/* ---------- picture slideshow ---------- */
const show = $("show");
let slideIdx = -1, timer = null, running = false, layers = [];

function makeLayer(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const d = document.createElement("div"); d.className = "slide";
      const bg = document.createElement("div"); bg.className = "bg"; bg.style.backgroundImage = 'url("' + src.replace(/"/g, "%22") + '")';
      d.style.setProperty("--dur", (SECS + 3) + "s");
      d.append(bg, img); res(d);
    };
    img.onerror = () => res(null);
    img.alt = ""; img.src = src;
  });
}
async function nextSlide() {
  if (!running || !IMAGES.length) return;
  let layer = null, tries = 0;
  while (!layer && tries++ < IMAGES.length) {
    slideIdx = (slideIdx + 1) % IMAGES.length;
    layer = await makeLayer(IMAGES[slideIdx]);
  }
  if (!layer || !running) { if (!layer) $("title").classList.add("on"); return; }
  $("title").classList.remove("on");
  show.appendChild(layer);
  layer.getBoundingClientRect();
  layer.classList.add("on");
  layers.forEach(o => { o.classList.remove("on"); setTimeout(() => o.remove(), 2200); });
  layers = [layer];
  clearTimeout(timer);
  timer = setTimeout(nextSlide, SECS * 1000);
}
function startShow() { if (running) return; running = true; show.hidden = false; nextSlide(); }
function stopShow() { running = false; clearTimeout(timer); layers.forEach(o => o.remove()); layers = []; show.hidden = true; }

/* ---------- slides / video from the presenter's tabs ---------- */
function slidesEmbed(raw) {
  raw = (raw || "").trim();
  const q = "?start=false&loop=false&delayms=3000";
  let m = raw.match(/\/presentation\/d\/e\/([\w-]+)/);
  if (m) return "https://docs.google.com/presentation/d/e/" + m[1] + "/embed" + q;
  m = raw.match(/\/presentation\/d\/([\w-]+)/);
  if (m) return "https://docs.google.com/presentation/d/" + m[1] + "/embed" + q;
  return null;
}
function videoSource(raw) {
  raw = (raw || "").trim();
  let m = raw.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if (m) {
    let start = 0;
    const tm = raw.match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?/);
    if (tm) start = (+tm[1] || 0) * 3600 + (+tm[2] || 0) * 60 + (+tm[3] || 0);
    return { type: "iframe", src: "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0" + (start ? "&start=" + start : "") };
  }
  m = raw.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return { type: "iframe", src: "https://drive.google.com/file/d/" + m[1] + "/preview" };
  if (/^https?:\/\//i.test(raw) || /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(raw)) return { type: "video", src: raw };
  return null;
}
const VIDEOS = (Array.isArray(CFG.videos) ? CFG.videos : []);
let embedKey = "";
function setEmbed(key, build) {
  if (key === embedKey) return;
  embedKey = key;
  const box = $("embed");
  box.replaceChildren();
  if (build) box.appendChild(build());
}
function msg(t) { const d = document.createElement("div"); d.className = "msg"; d.textContent = t; return d; }

/* ---------- following the presenter ---------- */
let state = { tab: "audio", playing: false, track: "", video: 0 };
function render() {
  const onAudio = state.tab === "audio";
  $("embed").classList.toggle("on", !onAudio);
  if (onAudio) {
    setEmbed("");
    if (IMAGES.length) startShow(); else { stopShow(); $("title").classList.add("on"); }
  } else {
    stopShow(); $("title").classList.remove("on");
    if (state.tab === "slides") {
      const u = slidesEmbed(CFG.slidesUrl);
      setEmbed("slides", () => {
        if (!u) return msg("No slideshow has been set up.");
        const f = document.createElement("iframe"); f.src = u; f.allowFullscreen = true; f.title = "Slideshow"; f.setAttribute("allow", "fullscreen"); return f;
      });
    } else {
      const v = VIDEOS[state.video], s = v && videoSource(v.src);
      setEmbed("video" + state.video, () => {
        if (!s) return msg("No video has been set up.");
        if (s.type === "iframe") {
          const f = document.createElement("iframe"); f.src = s.src; f.allowFullscreen = true; f.title = "Video";
          f.referrerPolicy = "strict-origin-when-cross-origin";
          f.setAttribute("allow", "fullscreen; autoplay; encrypted-media; picture-in-picture"); return f;
        }
        const e = document.createElement("video"); e.src = s.src; e.controls = true; e.playsInline = true; return e;
      });
    }
  }
  const cap = $("caption");
  const showCap = onAudio && state.playing && state.track && CFG.audienceCaption !== false;
  if (showCap) cap.textContent = state.track;
  cap.classList.toggle("on", !!showCap);
}

let ch = null;
try {
  ch = new BroadcastChannel("remembrance-day");
  ch.onmessage = e => { if (e.data && e.data.type === "state") { state = Object.assign(state, e.data.state); render(); } };
  ch.postMessage({ type: "hello" });
  addEventListener("pagehide", () => { try { ch.postMessage({ type: "bye" }); } catch (e) {} });
} catch (e) {
  $("hint").textContent = "This browser can't link the two windows. Use the latest Chrome, Edge, Firefox or Safari.";
}
render();

/* ---------- full screen, hidden cursor, hint ---------- */
function fs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
}
addEventListener("dblclick", fs);
addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") fs(); });
let idleT; function wake() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2500); }
addEventListener("mousemove", wake); wake();
setTimeout(() => $("hint").classList.add("off"), 7000);
</script>
</body>
</html>
